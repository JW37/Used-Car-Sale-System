spring.application.name=automart

# ---- MySQL ----
# Create the database first: CREATE DATABASE automart;
spring.datasource.url=jdbc:mysql://localhost:3306/automart?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=John@12
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# update = create tables if missing, keep existing data (good for dev).
# switch to "validate" once your schema is stable, and manage changes
# with a migration tool like Flyway in a real production project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ---- JWT ----
# Use a long, random, secret string in real deployments (env var, not committed).
jwt.secret=ChangeThisToARandomLongSecretKeyOfAtLeast256BitsForAutoMartApp
jwt.expiration-ms=86400000

# ---- File uploads ----
app.upload-dir=./uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

server.port=8080
